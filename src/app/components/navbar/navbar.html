<nav
  class="fixed start-0 top-0 z-20 w-full border-b border-default bg-neutral-primary font-heading text-brand-black"
>
  <div
    class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between p-4"
  >
    <a
      href="https://flowbite.com/"
      class="flex items-center space-x-3 rtl:space-x-reverse"
    >
      <img
        src="/images/gaya-logo-black.png"
        class="h-12"
        alt="Gaya-Store Logo"
      />
      <span
        class="self-center text-xl font-semibold whitespace-nowrap text-heading"
      ></span>
    </a>
    <div
      class="flex items-center space-x-3 md:order-2 md:space-x-0 rtl:space-x-reverse"
    >
      <button
        type="button"
        id="user-menu-button"
        class="flex rounded-full ring-1 ring-brand-black/10 ring-offset-2 ring-offset-brand-white transition hover:ring-brand-black focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-black"
        aria-expanded="false"
        data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom-end"
        data-dropdown-offset-distance="14"
      >
        <span class="sr-only">Open user menu</span>
        <img
          class="h-9 w-9 rounded-full object-cover"
          src="https://ahmed-esmail-dev.vercel.app/images/responsive/ahmed-esmail-portrait-4a67c2ca6d19-640.webp"
          alt="user photo"
        />
      </button>
      <!-- Dropdown menu -->
      <div
        id="user-dropdown"
        class="z-50 hidden w-64 border border-brand-black/10 bg-brand-white font-body text-brand-black shadow-[0_20px_40px_-12px_rgba(0,0,0,0.18)]"
      >
        <div class="flex items-center gap-3 bg-brand-ivory px-5 py-4">
          <img
            class="h-10 w-10 rounded-full object-cover"
            src="https://ahmed-esmail-dev.vercel.app/images/responsive/ahmed-esmail-portrait-4a67c2ca6d19-640.webp"
            alt=""
          />
          <div class="min-w-0">
            <p class="truncate font-heading text-base">
              Joseph McFall
            </p>
            <p class="truncate text-xs text-brand-black/50">
              name&#64;flowbite.com
            </p>
          </div>
        </div>

        <ul class="py-2 text-sm" aria-labelledby="user-menu-button">
          @for (item of menuItems; track item.label) {
            <li>
              <a
                href="#"
                class="group flex items-center gap-3 px-5 py-2.5 text-brand-black/70 transition hover:bg-brand-ivory hover:text-brand-black focus:bg-brand-ivory focus:text-brand-black focus:outline-none"
              >
                <svg
                  class="h-4 w-4 text-brand-stone transition group-hover:text-brand-black"
                  aria-hidden="true"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    [attr.d]="item.icon"
                  />
                </svg>
                {{ item.label }}
              </a>
            </li>
          }
        </ul>

        <div class="border-t border-brand-black/10 p-2">
          <a
            href="#"
            class="flex items-center justify-between px-3 py-2.5 text-xs tracking-[0.2em] uppercase transition hover:bg-brand-black hover:text-brand-white focus:bg-brand-black focus:text-brand-white focus:outline-none"
          >
            Sign out
            <svg
              class="h-4 w-4"
              aria-hidden="true"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M15 12H4m11 0-4-4m4 4-4 4M20 4v16"
              />
            </svg>
          </a>
        </div>
      </div>
      <button
        data-collapse-toggle="navbar-user"
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-base p-2 text-sm text-body hover:bg-neutral-secondary-soft hover:text-heading focus:ring-2 focus:ring-neutral-tertiary focus:outline-none md:hidden"
        aria-controls="navbar-user"
        aria-expanded="false"
      >
        <span class="sr-only">Open main menu</span>
        <svg
          class="h-6 w-6"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            d="M5 7h14M5 12h14M5 17h14"
          />
        </svg>
      </button>
    </div>
    <div
      class="hidden w-full items-center justify-between md:order-1 md:flex md:w-auto"
      id="navbar-user"
    >
      <ul
        class="mt-4 flex flex-col rounded-base border border-default bg-neutral-secondary-soft p-4 font-medium md:mt-0 md:flex-row md:space-x-8 md:border-0 md:bg-neutral-primary md:p-0 rtl:space-x-reverse"
      >
        <li>
          <a
            routerLink="/"
            routerLinkActive
            [routerLinkActiveOptions]="{
              exact: true,
            }"
            ariaCurrentWhenActive="page"
            class="block rounded px-3 py-2 text-heading hover:bg-neutral-tertiary aria-[current=page]:text-fg-brand md:border-0 md:p-0 md:hover:bg-transparent md:hover:text-fg-brand md:dark:hover:bg-transparent"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/products"
            routerLinkActive
            ariaCurrentWhenActive="page"
            class="block rounded px-3 py-2 text-heading hover:bg-neutral-tertiary aria-[current=page]:text-fg-brand md:border-0 md:p-0 md:hover:bg-transparent md:hover:text-fg-brand md:dark:hover:bg-transparent"
          >
            Products
          </a>
        </li>
        <li>
          <a
            routerLink="/categories"
            routerLinkActive
            ariaCurrentWhenActive="page"
            class="block rounded px-3 py-2 text-heading hover:bg-neutral-tertiary aria-[current=page]:text-fg-brand md:border-0 md:p-0 md:hover:bg-transparent md:hover:text-fg-brand md:dark:hover:bg-transparent"
          >
            Categories
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            routerLinkActive
            ariaCurrentWhenActive="page"
            class="block rounded px-3 py-2 text-heading hover:bg-neutral-tertiary aria-[current=page]:text-fg-brand md:border-0 md:p-0 md:hover:bg-transparent md:hover:text-fg-brand md:dark:hover:bg-transparent"
          >
            About
          </a>
        </li>
        <!-- <li>
        <a href="#" class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Contact</a>
      </li> -->
      </ul>
    </div>
  </div>
</nav>
