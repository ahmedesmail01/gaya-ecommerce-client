@let a = address();
@let s = section();

<div class="grid gap-x-4 gap-y-5 sm:grid-cols-2">
  <div class="sm:col-span-2">
    <label [for]="s + '-country'" class="field-label">Country</label>
    <select
      [id]="s + '-country'"
      [formField]="a.country"
      [attr.autocomplete]="s + ' country'"
      [attr.aria-invalid]="a.country().touched() && a.country().invalid()"
      [attr.aria-describedby]="s + '-country-error'"
      class="field-input"
      (change) ="this.selectedCountryCode.set($any($event.target).value)"
    >
      <option value="" disabled>Select a country</option>
      @for (country of countries(); track country.id) {
        <option [value]="country.code">{{ country.name }}</option>
      }
    </select>
    <app-field-errors [state]="a.country()" [id]="s + '-country-error'" />
  </div>

  <div class="sm:col-span-2">
    <label [for]="s + '-street'" class="field-label">Street address</label>
    <input
      type="text"
      [id]="s + '-street'"
      [formField]="a.street"
      [attr.autocomplete]="s + ' street-address'"
      [attr.aria-invalid]="a.street().touched() && a.street().invalid()"
      [attr.aria-describedby]="s + '-street-error'"
      class="field-input"
    />
    <app-field-errors [state]="a.street()" [id]="s + '-street-error'" />
  </div>

  <div>
    <label [for]="s + '-city'" class="field-label">City</label>
    <input
      type="text"
      [id]="s + '-city'"
      [formField]="a.city"
      [attr.autocomplete]="s + ' address-level2'"
      [attr.aria-invalid]="a.city().touched() && a.city().invalid()"
      [attr.aria-describedby]="s + '-city-error'"
      class="field-input"
    />
    <app-field-errors [state]="a.city()" [id]="s + '-city-error'" />
  </div>

  <div>
    <label [for]="s + '-state'" class="field-label">State / province</label>
    <select
      [id]="s + '-state'"
      [formField]="a.state"
      [attr.autocomplete]="s + ' address-level1'"
      [attr.aria-invalid]="a.state().touched() && a.state().invalid()"
      [attr.aria-describedby]="s + '-state-error'"
      class="field-input"
    >
      <option value="" disabled>Select a state</option>
      @for (state of states(); track state.id) {
        <option [value]="state.id">{{ state.name }}</option>
      }
    </select>
    <app-field-errors [state]="a.state()" [id]="s + '-state-error'" />
  </div>

</div>
